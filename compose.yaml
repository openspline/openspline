services:
  models:
    build: .
    command: ["models", "--directory", "/models", "--quality", "${OPENSPLINE_DOWNLOAD_QUALITY:-low}"]
    volumes: ["models:/models"]
  openspline:
    build: .
    depends_on:
      models:
        condition: service_completed_successfully
    gpus: all
    network_mode: host
    env_file: .env
    environment:
      OPENSPLINE_PUBLIC_URL: ${OPENSPLINE_PUBLIC_URL:-http://localhost:7860}
    volumes:
      - models:/models
      - runtime:/runtime
      - gpu-locks:/gpu-locks
      - ./workers.yaml:/app/workers.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/readyz')"]
      interval: 30s
      timeout: 5s
      start_period: 600s
  turn:
    image: coturn/coturn:4.6.3
    profiles: [turn]
    network_mode: host
    environment:
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      TURN_USER: ${TURN_USER:-openspline}
      TURN_REALM: ${TURN_REALM:-localhost}
    entrypoint: ["/bin/sh", "-ec"]
    command: ['test -n "$$TURN_PASSWORD" || { echo "Set TURN_PASSWORD" >&2; exit 1; }; exec turnserver -n --log-file=stdout --lt-cred-mech --fingerprint --no-cli --realm="$$TURN_REALM" --user="$$TURN_USER:$$TURN_PASSWORD" --min-port=49160 --max-port=49200']
volumes:
  models:
  runtime:
  gpu-locks:
