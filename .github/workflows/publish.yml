name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [python, npm]
        required: true
permissions:
  contents: read
jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: uv sync --all-packages --frozen && npm ci && npm run build && uv run pytest && npm test
      - if: inputs.target == 'python'
        run: uv build --all-packages && uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - if: inputs.target == 'npm'
        run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
